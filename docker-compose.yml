services:
  weather:
    build: .
    ports:
      - "0.0.0.0:8080:3000"
      - "0.0.0.0:80:3000"
    env_file:
      - .env.example
    environment:
      HOST: 0.0.0.0
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: ["node", "--watch", "src/server.js"]
    restart: unless-stopped
